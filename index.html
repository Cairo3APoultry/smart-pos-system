<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart POS</title>
<style>
:root{font-family:system-ui,Tahoma,sans-serif;color:#182333;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d9e0e8;background:white;border-radius:8px;padding:9px 13px}button.primary{background:#1464cf;color:white;border-color:#1464cf}button.danger{color:#b42318}button:disabled{opacity:.5;cursor:not-allowed}input,select{border:1px solid #d8e0e8;border-radius:8px;padding:10px;max-width:100%}aside{background:#142238;color:#eaf0f7;padding:22px 12px;min-height:100vh;width:230px;flex-shrink:0}aside h2{margin:0 10px 30px}aside button{width:100%;text-align:right;color:#dfe8f4;background:transparent;border:0;margin:2px 0}aside button.active{background:#294363;color:white}main{padding:24px;flex:1;min-width:0}.app{display:flex;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:24px}.panel{background:white;border:1px solid #e3e8ef;border-radius:12px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat strong{font-size:26px;display:block;margin-top:8px}.muted{color:#66788c;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:520px}td,th{padding:11px;text-align:right;border-bottom:1px solid #edf0f4}th{background:#f8fafc}.pos{display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,380px);gap:16px}.product{padding:14px;border:1px solid #e3e8ef;border-radius:10px;background:white;text-align:right}.product strong{display:block;margin-bottom:9px}.total{font-size:27px;font-weight:800}.notice{background:#fff7e6;border:1px solid #ffe2a8;padding:10px;border-radius:8px;margin-bottom:18px;font-size:13px}.hidden{display:none!important}@media(max-width:850px){aside{width:72px;padding:12px 5px}aside h2{font-size:12px;margin:0 3px 20px}aside button{font-size:0;text-align:center}aside button::first-letter{font-size:20px}.pos{grid-template-columns:1fr}main{padding:12px}}@media print{aside,.top,.actions,.notice{display:none!important}main{padding:0}.panel{border:0}}
</style></head><body><div class="app"><aside><h2>SMART POS</h2><nav id="nav"></nav></aside><main><div class="top"><div><h1 id="title">لوحة التحكم</h1><div class="muted">نظام إدارة المتجر — نسخة تجريبية محلية</div></div><button onclick="exportData()">تصدير نسخة JSON</button></div><div class="notice">نسخة تجريبية: تحفظ البيانات على هذا المتصفح فقط. لا تستخدمها لعمليات مالية حقيقية أو بيانات حساسة.</div><div id="view"></div></main></div>
<script>
'use strict';
const KEY='smart-pos-demo-v1';
const seed={products:[{id:'p1',name:'أرز 1 كجم',barcode:'62210001',category:'مواد غذائية',price:45,cost:35,stock:60},{id:'p2',name:'سكر 1 كجم',barcode:'62210002',category:'مواد غذائية',price:35,cost:27,stock:75},{id:'p3',name:'زيت 1 لتر',barcode:'62210003',category:'زيوت',price:85,cost:69,stock:35}],sales:[],purchases:[],expenses:[],customers:[],suppliers:[],movements:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{db=structuredClone(seed)}
for(const k of Object.keys(seed))if(!Array.isArray(db[k]))db[k]=[];
let cart=[],page='dashboard',search='';
const sections=[['dashboard','▦ الرئيسية'],['pos','🛒 نقطة البيع'],['products','▣ الأصناف'],['purchases','🚚 المشتريات'],['inventory','▤ المخزون'],['sales','▧ الفواتير'],['customers','♙ العملاء'],['suppliers','♧ الموردون'],['expenses','◈ المصروفات'],['reports','▥ التقارير'],['settings','⚙ الإعدادات']];
const $=id=>document.getElementById(id), money=n=>Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID(),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function go(p){page=p;search='';render()}function render(){ $('nav').innerHTML=sections.map(([id,n])=>'<button class="'+(page===id?'active':'')+'" onclick="go(\''+id+'\')">'+n+'</button>').join('');$('title').textContent=sections.find(x=>x[0]===page)?.[1].replace(/^[^ ]+ /,'')||page;const views={dashboard, pos,products,purchases,inventory,sales,customers,suppliers,expenses,reports,settings};$('view').innerHTML=views[page]()}
function dashboard(){const rev=sum(db.sales,x=>x.total),profit=sum(db.sales,x=>x.profit);return '<div class="grid">'+[['المبيعات',money(rev)+' ج.م'],['الفواتير',db.sales.length],['ربح إجمالي تقديري',money(profit)+' ج.م'],['الأصناف',db.products.length],['منخفض المخزون',db.products.filter(x=>x.stock<=10).length]].map(x=>'<div class="panel stat"><span class="muted">'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="panel"><h3>آخر الفواتير</h3>'+salesTable(db.sales.slice(-8).reverse())+'</div>'}
function pos(){const matches=db.products.filter(p=>(p.name+' '+p.barcode).includes(search));return '<div class="pos"><div class="panel"><h3>المنتجات</h3><input placeholder="بحث بالاسم أو الباركود" value="'+esc(search)+'" oninput="search=this.value;render()" autofocus><div class="grid" style="margin-top:14px">'+matches.map(p=>'<button class="product" onclick="addCart(\''+p.id+'\')" '+(p.stock<=0?'disabled':'')+'><strong>'+esc(p.name)+'</strong><span class="muted">'+esc(p.barcode)+' | متاح '+p.stock+'</span><p>'+money(p.price)+' ج.م</p></button>').join('')+'</div></div><div class="panel"><h3>الفاتورة الحالية</h3><div class="tablewrap"><table><thead><tr><th>الصنف</th><th>الكمية</th><th>الإجمالي</th><th></th></tr></thead><tbody>'+cart.map(x=>{const p=db.products.find(p=>p.id===x.id);return '<tr><td>'+esc(p.name)+'</td><td><button onclick="qty(\''+x.id+'\',-1)">−</button> '+x.qty+' <button onclick="qty(\''+x.id+'\',1)">+</button></td><td>'+money(p.price*x.qty)+'</td><td><button class="danger" onclick="removeCart(\''+x.id+'\')">حذف</button></td></tr>'}).join('')+'</tbody></table></div><hr><p>الإجمالي</p><div class="total">'+money(cartTotal())+' ج.م</div><div class="actions"><select id="method"><option>نقدي</option><option>بطاقة</option><option>تحويل</option></select><button class="primary" onclick="checkout()" '+(!cart.length?'disabled':'')+'>إتمام البيع</button><button onclick="cart=[];render()">مسح</button></div></div></div>'}
function addCart(id){const p=db.products.find(x=>x.id===id),c=cart.find(x=>x.id===id);if((c?.qty||0)>=p.stock)return alert('الكمية غير متاحة');c?c.qty++:cart.push({id,qty:1});render()}function qty(id,n){const c=cart.find(x=>x.id===id),p=db.products.find(x=>x.id===id);c.qty=Math.min(p.stock,c.qty+n);cart=cart.filter(x=>x.qty>0);render()}function removeCart(id){cart=cart.filter(x=>x.id!==id);render()}function cartTotal(){return sum(cart,x=>db.products.find(p=>p.id===x.id).price*x.qty)}
function checkout(){if(!cart.length)return;for(const x of cart){const p=db.products.find(p=>p.id===x.id);if(!p||p.stock<x.qty)return alert('رصيد غير كافٍ: '+(p?.name||x.id))}const items=cart.map(x=>{const p=db.products.find(p=>p.id===x.id);return {productId:p.id,name:p.name,qty:x.qty,price:p.price,cost:p.cost}});const sale={id:uid(),number:'INV-'+String(db.sales.length+1).padStart(5,'0'),date:new Date().toISOString(),items,total:sum(items,x=>x.price*x.qty),profit:sum(items,x=>(x.price-x.cost)*x.qty),method:$('method').value};for(const x of items){const p=db.products.find(p=>p.id===x.productId);p.stock-=x.qty;db.movements.push({id:uid(),date:sale.date,productId:p.id,qty:-x.qty,reason:sale.number})}db.sales.push(sale);save();cart=[];render();alert('تم حفظ الفاتورة '+sale.number+' محليًا')}
function products(){return '<div class="panel"><div class="actions"><button class="primary" onclick="newProduct()">+ صنف جديد</button><button onclick="exportCSV()">تصدير الأصناف CSV</button></div><div class="tablewrap"><table><tr><th>الصنف</th><th>الباركود</th><th>التصنيف</th><th>التكلفة</th><th>السعر</th><th>المخزون</th><th></th></tr>'+db.products.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.barcode)+'</td><td>'+esc(p.category)+'</td><td>'+money(p.cost)+'</td><td>'+money(p.price)+'</td><td>'+p.stock+'</td><td><button onclick="editProduct(\''+p.id+'\')">تعديل</button></td></tr>').join('')+'</table></div></div>'}
function ask(label,old=''){const v=prompt(label,String(old));return v===null?null:v.trim()}function numeric(label,old=0){const v=ask(label,old);if(v===null)return null;const n=Number(v);if(!Number.isFinite(n)||n<0){alert('قيمة رقمية غير صحيحة');return null}return n}
function newProduct(){const name=ask('اسم الصنف');if(!name)return;const barcode=ask('الباركود')||'';if(barcode&&db.products.some(x=>x.barcode===barcode))return alert('الباركود موجود');const category=ask('التصنيف','عام')||'عام',cost=numeric('التكلفة'),price=numeric('سعر البيع'),stock=numeric('الرصيد الافتتاحي');if([cost,price,stock].some(x=>x===null))return;const p={id:uid(),name,barcode,category,cost,price,stock};db.products.push(p);if(stock)db.movements.push({id:uid(),date:new Date().toISOString(),productId:p.id,qty:stock,reason:'رصيد افتتاحي'});save();render()}
function editProduct(id){const p=db.products.find(x=>x.id===id),name=ask('اسم الصنف',p.name);if(!name)return;const cost=numeric('التكلفة',p.cost),price=numeric('سعر البيع',p.price);if(cost===null||price===null)return;Object.assign(p,{name,cost,price});save();render()}
function inventory(){return '<div class="panel"><h3>أرصدة وحركات المخزون</h3><div class="actions"><button onclick="adjustStock()">تسوية مخزون</button></div><div class="tablewrap"><table><tr><th>الصنف</th><th>الرصيد</th><th>القيمة بالتكلفة</th></tr>'+db.products.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+p.stock+'</td><td>'+money(p.stock*p.cost)+'</td></tr>').join('')+'</table></div><h3>آخر الحركات</h3><div class="tablewrap"><table><tr><th>التاريخ</th><th>الصنف</th><th>الكمية</th><th>السبب</th></tr>'+db.movements.slice(-30).reverse().map(x=>'<tr><td>'+new Date(x.date).toLocaleString('ar-EG')+'</td><td>'+esc(db.products.find(p=>p.id===x.productId)?.name||'')+'</td><td>'+x.qty+'</td><td>'+esc(x.reason)+'</td></tr>').join('')+'</table></div></div>'}
function adjustStock(){const barcode=ask('باركود الصنف');if(!barcode)return;const p=db.products.find(x=>x.barcode===barcode);if(!p)return alert('الصنف غير موجود');const stock=numeric('الرصيد الفعلي الجديد',p.stock);if(stock===null)return;const diff=stock-p.stock;if(!diff)return;p.stock=stock;db.movements.push({id:uid(),date:new Date().toISOString(),productId:p.id,qty:diff,reason:'تسوية يدوية'});save();render()}
function purchases(){return '<div class="panel"><h3>استلام مشتريات تجريبي</h3><div class="actions"><button class="primary" onclick="receive()">+ استلام صنف</button></div><div class="tablewrap"><table><tr><th>التاريخ</th><th>الصنف</th><th>الكمية</th><th>التكلفة</th></tr>'+db.purchases.slice().reverse().map(x=>'<tr><td>'+new Date(x.date).toLocaleString('ar-EG')+'</td><td>'+esc(x.name)+'</td><td>'+x.qty+'</td><td>'+money(x.cost)+'</td></tr>').join('')+'</table></div></div>'}
function receive(){const barcode=ask('باركود الصنف');if(!barcode)return;const p=db.products.find(x=>x.barcode===barcode);if(!p)return alert('الصنف غير موجود');const qty=numeric('كمية الاستلام',1),cost=numeric('تكلفة الوحدة',p.cost);if(qty===null||cost===null||qty<=0)return;const date=new Date().toISOString();p.stock+=qty;p.cost=cost;db.purchases.push({id:uid(),date,productId:p.id,name:p.name,qty,cost});db.movements.push({id:uid(),date,productId:p.id,qty,reason:'استلام مشتريات'});save();render()}
function salesTable(arr){return '<div class="tablewrap"><table><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>الإجمالي</th><th>طريقة الدفع</th><th></th></tr>'+arr.map(x=>'<tr><td>'+esc(x.number)+'</td><td>'+new Date(x.date).toLocaleString('ar-EG')+'</td><td>'+money(x.total)+'</td><td>'+esc(x.method)+'</td><td><button onclick="printSale(\''+x.id+'\')">طباعة</button></td></tr>').join('')+'</table></div>'}
function sales(){return '<div class="panel"><h3>سجل المبيعات</h3>'+salesTable(db.sales.slice().reverse())+'</div>'}
function printSale(id){const x=db.sales.find(s=>s.id===id);if(!x)return;const w=window.open('','_blank','width=420,height=650');if(!w)return alert('اسمح بالنوافذ المنبثقة للطباعة');w.document.write('<!doctype html><html dir="rtl"><meta charset="utf-8"><title>فاتورة</title><style>body{font-family:Tahoma;padding:20px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px dashed #aaa}</style><h2>Smart POS — فاتورة تجريبية</h2><p>'+esc(x.number)+' | '+new Date(x.date).toLocaleString('ar-EG')+'</p><table><tr><th>الصنف</th><th>كمية</th><th>قيمة</th></tr>'+x.items.map(i=>'<tr><td>'+esc(i.name)+'</td><td>'+i.qty+'</td><td>'+money(i.qty*i.price)+'</td></tr>').join('')+'</table><h2>الإجمالي: '+money(x.total)+' ج.م</h2><p>نسخة تجريبية غير ضريبية</p></html>');w.document.close();w.focus();w.print()}
function directory(kind,label){return '<div class="panel"><div class="actions"><button class="primary" onclick="addParty(\''+kind+'\')">+ إضافة '+label+'</button></div><div class="tablewrap"><table><tr><th>الاسم</th><th>الهاتف</th></tr>'+db[kind].map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.phone)+'</td></tr>').join('')+'</table></div></div>'}function customers(){return directory('customers','عميل')}function suppliers(){return directory('suppliers','مورد')}function addParty(kind){const name=ask('الاسم');if(!name)return;const phone=ask('الهاتف')||'';db[kind].push({id:uid(),name,phone});save();render()}
function expenses(){return '<div class="panel"><button class="primary" onclick="addExpense()">+ تسجيل مصروف</button><div class="tablewrap"><table><tr><th>التاريخ</th><th>البيان</th><th>القيمة</th></tr>'+db.expenses.slice().reverse().map(x=>'<tr><td>'+new Date(x.date).toLocaleString('ar-EG')+'</td><td>'+esc(x.note)+'</td><td>'+money(x.amount)+'</td></tr>').join('')+'</table></div></div>'}function addExpense(){const note=ask('البيان');if(!note)return;const amount=numeric('القيمة');if(amount===null||amount<=0)return;db.expenses.push({id:uid(),date:new Date().toISOString(),note,amount});save();render()}
function reports(){return '<div class="grid">'+[['إجمالي المبيعات',sum(db.sales,x=>x.total)],['إجمالي تكلفة المبيعات',sum(db.sales,x=>x.total-x.profit)],['مجمل الربح التقديري',sum(db.sales,x=>x.profit)],['المصروفات',sum(db.expenses,x=>x.amount)],['صافي تقديري',sum(db.sales,x=>x.profit)-sum(db.expenses,x=>x.amount)],['قيمة المخزون بالتكلفة',sum(db.products,x=>x.stock*x.cost)]].map(x=>'<div class="panel stat"><span class="muted">'+x[0]+'</span><strong>'+money(x[1])+'</strong></div>').join('')+'</div><div class="panel muted">التقارير توضيحية وتعتمد على تكلفة الوحدة المحفوظة وقت البيع، ولا تمثل محاسبة مالية أو ضريبية معتمدة.</div>'}
function settings(){return '<div class="panel"><h3>إدارة البيانات التجريبية</h3><p>كل البيانات محفوظة في localStorage لهذا المتصفح فقط.</p><div class="actions"><button onclick="exportData()">تنزيل نسخة احتياطية JSON</button><button class="danger" onclick="resetDemo()">إعادة ضبط البيانات التجريبية</button></div></div>'}
function download(name,data,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportData(){download('smart-pos-demo.json',JSON.stringify(db,null,2),'application/json')}function exportCSV(){download('products.csv','\ufeff'+['name,barcode,category,cost,price,stock',...db.products.map(x=>[x.name,x.barcode,x.category,x.cost,x.price,x.stock].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\r\n'),'text/csv;charset=utf-8')}function resetDemo(){if(confirm('سيتم حذف جميع البيانات المحلية التجريبية. متابعة؟')){db=structuredClone(seed);cart=[];save();render()}}
render();
</script><script src="./enhancements.js"></script></body></html>
